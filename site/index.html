<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Is X Dead Yet?</title>
  <meta name="description" content="A configurable single-serving status page.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="status-page">
    <section class="status" aria-labelledby="question">
      <h1 id="question">Is X Dead Yet?</h1>
      <p class="answer" id="answer">No.</p>

      <div class="divider" aria-hidden="true"></div>

      <img id="dead-image" class="dead-image" src="" alt="" hidden>
      
      <div class="divider" aria-hidden="true"></div>

      <div class="checked">
        <p class="label">Last checked</p>
        <time id="last-checked"></time>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="status.js"></script>
  <script src="app.js"></script>
</body>
</html>
